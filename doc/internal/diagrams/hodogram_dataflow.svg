<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="720" viewBox="0 0 1100 720" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#222"/>
    </marker>
    <marker id="arrowHeld" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1f6feb"/>
    </marker>
  </defs>

  <!-- Sources (row 1) -->
  <g>
    <rect x="60" y="30" width="180" height="55" rx="6" fill="#fff7d6" stroke="#222" stroke-width="1.5"/>
    <text x="150" y="63" text-anchor="middle" font-size="14" font-weight="bold">CsvSource_N</text>
  </g>
  <g>
    <rect x="460" y="30" width="180" height="55" rx="6" fill="#fff7d6" stroke="#222" stroke-width="1.5"/>
    <text x="550" y="56" text-anchor="middle" font-size="14" font-weight="bold">ValueSource</text>
    <text x="550" y="74" text-anchor="middle" font-size="11" fill="#444">count = N</text>
  </g>
  <g>
    <rect x="860" y="30" width="180" height="55" rx="6" fill="#fff7d6" stroke="#222" stroke-width="1.5"/>
    <text x="950" y="63" text-anchor="middle" font-size="14" font-weight="bold">CsvSource_E</text>
  </g>

  <!-- SlidingWindows (row 2) -->
  <g>
    <rect x="60" y="160" width="180" height="55" rx="6" fill="#dbeafe" stroke="#222" stroke-width="1.5"/>
    <text x="150" y="183" text-anchor="middle" font-size="14" font-weight="bold">SlidingWindow_N</text>
    <text x="150" y="200" text-anchor="middle" font-size="10" fill="#444">dataset (held) · window_index</text>
  </g>
  <g>
    <rect x="860" y="160" width="180" height="55" rx="6" fill="#dbeafe" stroke="#222" stroke-width="1.5"/>
    <text x="950" y="183" text-anchor="middle" font-size="14" font-weight="bold">SlidingWindow_E</text>
    <text x="950" y="200" text-anchor="middle" font-size="10" fill="#444">dataset (held) · window_index</text>
  </g>

  <!-- Plots (row 3) -->
  <g>
    <rect x="60" y="300" width="180" height="55" rx="6" fill="#dbeafe" stroke="#222" stroke-width="1.5"/>
    <text x="150" y="323" text-anchor="middle" font-size="14" font-weight="bold">PlotSeries_N</text>
    <text x="150" y="340" text-anchor="middle" font-size="10" fill="#444">dataset (held) · band</text>
  </g>
  <g>
    <rect x="460" y="300" width="180" height="55" rx="6" fill="#dbeafe" stroke="#222" stroke-width="1.5"/>
    <text x="550" y="332" text-anchor="middle" font-size="14" font-weight="bold">Hodogram</text>
  </g>
  <g>
    <rect x="860" y="300" width="180" height="55" rx="6" fill="#dbeafe" stroke="#222" stroke-width="1.5"/>
    <text x="950" y="323" text-anchor="middle" font-size="14" font-weight="bold">PlotSeries_E</text>
    <text x="950" y="340" text-anchor="middle" font-size="10" fill="#444">dataset (held) · band</text>
  </g>

  <!-- Mosaic / Display / VideoSink -->
  <g>
    <rect x="460" y="440" width="180" height="55" rx="6" fill="#dbeafe" stroke="#222" stroke-width="1.5"/>
    <text x="550" y="472" text-anchor="middle" font-size="14" font-weight="bold">Mosaic</text>
  </g>
  <g>
    <rect x="460" y="540" width="180" height="55" rx="6" fill="#dbeafe" stroke="#222" stroke-width="1.5"/>
    <text x="550" y="572" text-anchor="middle" font-size="14" font-weight="bold">Display</text>
  </g>
  <g>
    <rect x="460" y="640" width="180" height="55" rx="6" fill="#e6e6e6" stroke="#222" stroke-width="1.5"/>
    <text x="550" y="672" text-anchor="middle" font-size="14" font-weight="bold">VideoSink</text>
  </g>

  <!-- Hold edges (dashed blue) -->
  <line x1="150" y1="85" x2="150" y2="160" stroke="#1f6feb" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#arrowHeld)"/>
  <path d="M 90 85 Q 15 200 90 300" fill="none" stroke="#1f6feb" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#arrowHeld)"/>
  <line x1="950" y1="85" x2="950" y2="160" stroke="#1f6feb" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#arrowHeld)"/>
  <path d="M 1010 85 Q 1085 200 1010 300" fill="none" stroke="#1f6feb" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#arrowHeld)"/>

  <!-- Clock from ValueSource (fan-out) -->
  <path d="M 550 85 L 550 125 L 200 125 L 200 160" fill="none" stroke="#222" stroke-width="1.8" marker-end="url(#arrow)"/>
  <path d="M 550 125 L 900 125 L 900 160" fill="none" stroke="#222" stroke-width="1.8" marker-end="url(#arrow)"/>
  <circle cx="550" cy="125" r="3.5" fill="#222"/>

  <!-- SlidingWindow -> Hodogram -->
  <line x1="240" y1="187.5" x2="460" y2="327.5" stroke="#222" stroke-width="1.8" marker-end="url(#arrow)"/>
  <line x1="860" y1="187.5" x2="640" y2="327.5" stroke="#222" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="320" y="252" font-size="10" fill="#444">x</text>
  <text x="780" y="252" font-size="10" fill="#444">y</text>

  <!-- SlidingWindow -> PlotSeries (band) -->
  <line x1="150" y1="215" x2="150" y2="300" stroke="#222" stroke-width="1.8" marker-end="url(#arrow)"/>
  <line x1="950" y1="215" x2="950" y2="300" stroke="#222" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="160" y="260" font-size="10" fill="#444">band_start, band_end</text>
  <text x="803" y="260" font-size="10" fill="#444">band_start, band_end</text>

  <!-- Hodogram -> Mosaic -->
  <line x1="550" y1="355" x2="550" y2="440" stroke="#222" stroke-width="1.8" marker-end="url(#arrow)"/>
  <!-- PlotSeries_N -> Mosaic -->
  <line x1="240" y1="327.5" x2="460" y2="467.5" stroke="#222" stroke-width="1.8" marker-end="url(#arrow)"/>
  <!-- PlotSeries_E -> Mosaic -->
  <line x1="860" y1="327.5" x2="640" y2="467.5" stroke="#222" stroke-width="1.8" marker-end="url(#arrow)"/>

  <!-- Mosaic -> Display -> VideoSink -->
  <line x1="550" y1="495" x2="550" y2="540" stroke="#222" stroke-width="1.8" marker-end="url(#arrow)"/>
  <line x1="550" y1="595" x2="550" y2="640" stroke="#222" stroke-width="1.8" marker-end="url(#arrow)"/>

  <!-- Legend -->
  <g transform="translate(40, 645)">
    <rect x="0" y="0" width="380" height="55" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="4"/>
    <text x="14" y="20" font-size="12" font-weight="bold">Legende</text>
    <line x1="14" y1="38" x2="60" y2="38" stroke="#222" stroke-width="1.8" marker-end="url(#arrow)"/>
    <text x="68" y="42" font-size="11">Stream / Clock</text>
    <line x1="190" y1="38" x2="236" y2="38" stroke="#1f6feb" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#arrowHeld)"/>
    <text x="244" y="42" font-size="11">held (hold_last)</text>
  </g>
</svg>
